name: Bug report
description: Report a reproducible correctness or compatibility problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include proprietary commands, environment variables, transcripts, or endpoint logs.
  - type: input
    id: version
    attributes:
      label: Agent Governor version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: macOS architecture
      options: [Apple Silicon, Intel, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal redacted reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
