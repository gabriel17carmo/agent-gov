name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild; leave blank to release the version on main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      tag: ${{ steps.release.outputs.tag }}
      tag-exists: ${{ steps.release.outputs.tag-exists }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: >-
            ${{ github.event_name == 'push' && github.ref ||
            (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag) ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) ||
            github.sha }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_SELECTED_REF: ${{ github.ref_name }}
        run: scripts/release-plan.sh

  universal-macos:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: scripts/build-universal.sh
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --all
      - run: test "$(dist/agent-gov --version)" = "agent-gov ${{ needs.plan.outputs.version }}"
      - run: shasum -a 256 dist/agent-gov > dist/agent-gov.sha256
      - run: cp agent-gov.cdx.json dist/agent-gov.cdx.json
      - run: cp install-agent-gov.sh dist/install-agent-gov.sh
      - name: Attest release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          TAG: ${{ needs.plan.outputs.tag }}
          TAG_EXISTS: ${{ needs.plan.outputs.tag-exists }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            release_flags=()
            if [[ "$PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi

            if [[ "$TAG_EXISTS" == "true" ]]; then
              gh release create "$TAG" dist/* --generate-notes --verify-tag --title "Agent Governor $TAG" "${release_flags[@]}"
            else
              gh release create "$TAG" dist/* --generate-notes --target "$SOURCE_SHA" --title "Agent Governor $TAG" "${release_flags[@]}"
            fi
          fi
