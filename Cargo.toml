[package]
name = "agent-gov"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A local workload governor for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/gabriel17carmo/agent-gov"
readme = "README.md"
keywords = ["agents", "developer-tools", "macos", "scheduler", "rtk"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.48", default-features = false, features = ["derive", "help", "std", "usage"] }
fs4 = "1.1.0"
libc = "0.2.175"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "term", "user"] }
rand = "0.9.2"
signal-hook = "0.3.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
shlex = "1.3.0"
thiserror = "2.0.17"
toml = "0.9.7"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.8.0"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
